plugins { id 'com.android.application' }
android {
    namespace 'com.shiro.droid'
    compileSdk 34
    defaultConfig {
        applicationId 'com.shiro.droid'
        minSdk 9
        targetSdk 30
        versionCode 1
        versionName '1.0.0-canary'
        ndk { abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    sourceSets { main { jniLibs.srcDirs = [findProperty('shiro.jnilibs') ?: "${rootDir}/build/jniLibs"] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
android.testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
        def hostLibs = System.getenv('SHIRODROID_HOST_LIB_DIR') ?: ''
        def cache = System.getenv('SHIRODROID_ROBOLECTRIC') ?: "${rootDir}/../cache/robolectric"
        systemProperty 'robolectric.dependency.dir', cache
        systemProperty 'robolectric.offline', 'true'
        if (hostLibs) jvmArgs "-Djava.library.path=${hostLibs}"
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
